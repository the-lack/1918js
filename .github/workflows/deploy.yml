name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]

  # enable running workflow manually from the Actions tab
  workflow_dispatch:

# set GITHUB_TOKEN permissions GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# allow only one concurrent deployment, skip runs queued between the run in-progress and latest queued
# however, do NOT cancel in-progress runs as production deployments must complete
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Not needed if lastUpdated is not enabled
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Repo works?
        run: bun works

      - name: Build with VitePress
        run: bun run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
